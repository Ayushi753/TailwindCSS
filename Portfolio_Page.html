<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio_Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div class="bg-white rounded-2xl shadow-lg p-6">
      <div>
        <h2 class="text-gray-500 mt-2">Kuch bna rhi hu bn jana😭.</h2>

        <p class="text-gray-500 mt-1">Let's get things done today.</p>
      </div>

      <div class="text-2xl">🔔</div>
    </div>

    <div class="grid grid-cols-3 gap-4 mt-6">
      <!------Task----->
      <div class="border rounded-xl p-4">
        <p class="text-gray-500 text-sm">Tasks</p>
        <div class="flex justify-between items-center mt-2">
          <h3 class="text-2xl font-bold">24</h3>
          <span class="text-purple-500 text-xl">☷</span>
        </div>
      </div>

      <!---Complete--->
      <div class="border rounded-xl p-4">
        <p class="text-gray-500 text-sm">Complete</p>
        <div class="flex justify-between items-center mt-2">
          <h3 class="text-2xl font-bold">16</h3>
          <span class="text-green-500 text-xl">✓</span>
        </div>
      </div>

      <!-- In Progress -->
      <div class="border rounded-xl p-4">
        <p class="text-gray-500 text-sm">In Progress</p>
        <div class="flex justify-between items-center mt-2">
          <h3 class="text-2xl font-bold">8</h3>
          <span class="text-purple-500 text-xl">◷</span>
        </div>
      </div>
    </div>

    <div class="mt-8">

    <h2 class="text-xl font-bold text-gray-800">
        Today's Tasks
    </h2>

    <div class="mt-4 space-y-3">

        <!-- Task 1 -->
        <div class="flex items-center justify-between border rounded-xl p-4">
            <div class="flex items-center gap-3">
                <input type="checkbox">
                <span class="text-gray-700">
                    Design landing page
                </span>
            </div>

            <span class="text-sm text-purple-500">
                High
            </span>
        </div>

        <!-- Task 2 -->
        <div class="flex items-center justify-between border rounded-xl p-4">
            <div class="flex items-center gap-3">
                <input type="checkbox">
                <span class="text-gray-700">
                    Complete DSA practice
                </span>
            </div>

            <span class="text-sm text-yellow-500">
                Medium
            </span>
        </div>

        <!-- Task 3 -->
        <div class="flex items-center justify-between border rounded-xl p-4">
            <div class="flex items-center gap-3">
                <input type="checkbox">
                <span class="text-gray-700">
                    Prepare project presentation
                </span>
            </div>

            <span class="text-sm text-green-500">
                Low
            </span>
        </div>

    </div>

</div>
  </body>
</html>
